[project]
name = "riscv-rag-assistant"
version = "0.1.0"
description = "RAG assistant for the RISC-V (RV32I) specification with verifiable citations"
readme = "README.md"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["chroma_db", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
